name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Never include credentials, private records, or sensitive personal data."
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and versions
    validations:
      required: false
